<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>未來財報預測</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script> <style>
    .chart-container { position: relative; height:50vh; width:80vw; margin: 20px auto; }
    .controls { margin-bottom: 20px; }
    .controls label, .controls select, .controls input { margin: 0 10px; }
  </style>
</head>
<body onload="initializeSimulation()">
  <header>
    <h2 id="backLink">← 回上一頁</h2> 
  </header>

  <main>
    <h1>未來財報預測</h1>
    <div class="controls">
      <label for="revenueGrowth">營收成長率 (%):</label>
      <input type="number" id="revenueGrowth" value="0" step="1" oninput="debouncedRunSimulation()">

      <label for="timeScale">時間尺度:</label>
      <select id="timeScale" onchange="updateSliderAndRun()">
        <option value="monthly" selected>月</option>
        <option value="weekly">週</option>
        <option value="daily">日</option>
      </select>

      <label for="periodsSlider">模擬期數 (<span id="timeScaleLabel">月</span>):</label>
      <input type="range" id="periodsSlider" min="1" max="24" value="12" oninput="updatePeriodsAndRun()">
      <span id="periodsValue">12</span>
    </div>

    <div class="chart-container">
      <canvas id="forecastChart"></canvas>
    </div>
    <p id="statusMessage"></p>
  </main>

  <script>
    const API_BASE_URL = ""; // 或 const API_BASE_URL = "/";
    // 之後呼叫 API 時，fetch("/token") 或 fetch("/users/") 即可
    let reportId = null;
    let forecastChart = null; // Chart.js 實例
    let debounceTimer;

    function initializeSimulation() {
      // 從 URL 取得 report_id
      const urlParams = new URLSearchParams(window.location.search);
      reportId = urlParams.get('report_id');
      
      // 設定返回連結
      const backLink = document.getElementById('backLink');
      backLink.style.cursor = 'pointer';
      backLink.onclick = () => window.location.href = `/analysis`; // 假設 analysis.html 會處理 sessionStorage
      
      if (!reportId) {
        document.getElementById('statusMessage').textContent = '錯誤：找不到基礎報告 ID。';
        return;
      }
      
      // 初始化圖表
      renderForecastChart([]); 
      // 執行一次初始模擬
      runSimulation(); 
    }

    function updateSliderAndRun() {
        const timeScale = document.getElementById('timeScale').value;
        const slider = document.getElementById('periodsSlider');
        const periodsLabel = document.getElementById('timeScaleLabel');
        
        // 根據時間尺度調整滑桿範圍和標籤
        if (timeScale === 'daily') {
            slider.max = 365; 
            slider.value = Math.min(slider.value, 365); // 確保不超過最大值
            periodsLabel.textContent = '日';
        } else if (timeScale === 'weekly') {
            slider.max = 104; // 約 2 年
            slider.value = Math.min(slider.value, 104);
            periodsLabel.textContent = '週';
        } else { // monthly
            slider.max = 24; // 2 年
            slider.value = Math.min(slider.value, 24);
            periodsLabel.textContent = '月';
        }
        updatePeriodsValue(); // 更新顯示的期數
        runSimulation(); // 立刻執行模擬
    }
    
    function updatePeriodsValue() {
        document.getElementById('periodsValue').textContent = document.getElementById('periodsSlider').value;
    }

    function updatePeriodsAndRun() {
        updatePeriodsValue();
        debouncedRunSimulation();
    }

    // Debounce 函式，延遲執行 runSimulation
    function debouncedRunSimulation() {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(runSimulation, 300); // 延遲 300 毫秒
    }

    async function runSimulation() {
      const statusMessage = document.getElementById('statusMessage');
      statusMessage.textContent = '模擬計算中...';

      const token = localStorage.getItem('accessToken');
      const tokenType = localStorage.getItem('tokenType') || 'Bearer';

      if (!token || !reportId) {
        statusMessage.textContent = '錯誤：未登入或缺少報告 ID。';
        return;
      }

      // 讀取目前參數
      const revenueGrowthInput = document.getElementById('revenueGrowth').value;
      const revenueGrowth = parseFloat(revenueGrowthInput) / 100 || 0; // 轉換為小數
      const timeScale = document.getElementById('timeScale').value;
      const periods = parseInt(document.getElementById('periodsSlider').value);

      try {
        const response = await fetch(`${API_BASE_URL}/api/v1/simulate`, {
          method: 'POST',
          headers: {
            'Authorization': `${tokenType} ${token}`,
            'Content-Type': 'application/json',
            'accept': 'application/json'
          },
          body: JSON.stringify({
            report_id: parseInt(reportId),
            revenue_growth: revenueGrowth,
            time_scale: timeScale,
            periods: periods
          })
        });

        if (response.ok) {
          const result = await response.json();
          renderForecastChart(result.forecast_cash_balance, result.time_scale);
          statusMessage.textContent = '模擬完成。';
        } else {
          const errorData = await response.json();
          statusMessage.textContent = `模擬失敗：${errorData.detail || response.statusText}`;
          console.error('Simulation failed:', errorData);
          renderForecastChart([]); // 清空圖表
        }
      } catch (error) {
        statusMessage.textContent = '模擬時發生網路錯誤。';
        console.error('Simulation network error:', error);
        renderForecastChart([]); // 清空圖表
      }
    }

    function renderForecastChart(data, scale = 'monthly') {
      const ctx = document.getElementById('forecastChart').getContext('2d');
      
      // 產生 X 軸標籤
      const labels = [];
      let labelPrefix = '';
      if (scale === 'daily') labelPrefix = '第 ';
      else if (scale === 'weekly') labelPrefix = '第 ';
      else labelPrefix = '第 ';
      
      let labelSuffix = '';
       if (scale === 'daily') labelSuffix = ' 天';
      else if (scale === 'weekly') labelSuffix = ' 週';
      else labelSuffix = ' 個月';

      for (let i = 1; i <= data.length; i++) {
          labels.push(`${labelPrefix}${i}${labelSuffix}`);
      }

      // 如果圖表已存在，先銷毀舊的
      if (forecastChart) {
        forecastChart.destroy();
      }

      // 建立新的圖表
      forecastChart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{
            label: '預估現金餘額',
            data: data,
            borderColor: 'rgb(75, 192, 192)',
            tension: 0.1
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            y: {
              beginAtZero: false // 現金餘額可能為負
            }
          }
        }
      });
    }
  </script>
</body>
</html>
